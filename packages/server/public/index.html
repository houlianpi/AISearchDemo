<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Copilot Search</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="App navigation">
      <div class="sidebar-logo" aria-label="Microsoft Bing">
        <span class="microsoft-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="sidebar-divider" aria-hidden="true"></div>
      <button id="new-session" class="sidebar-button" type="button" aria-label="Start a new session">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M21.7803 3.28033C22.0732 2.98744 22.0732 2.51256 21.7803 2.21967C21.4874 1.92678 21.0125 1.92678 20.7196 2.21967L10.7197 12.2197L10.25 13.75L11.7803 13.2803L21.7803 3.28033ZM6.25 3C4.45507 3 3 4.45508 3 6.25V17.75C3 19.5449 4.45507 21 6.25 21H17.75C19.5449 21 21 19.5449 21 17.75V9.75C21 9.33579 20.6642 9 20.25 9C19.8358 9 19.5 9.33579 19.5 9.75V17.75C19.5 18.7165 18.7165 19.5 17.75 19.5H6.25C5.2835 19.5 4.5 18.7165 4.5 17.75V6.25C4.5 5.2835 5.2835 4.5 6.25 4.5H14.25C14.6642 4.5 15 4.16421 15 3.75C15 3.33579 14.6642 3 14.25 3H6.25Z"/></svg>
      </button>
      <button class="sidebar-button account-button" type="button" aria-label="Account">
        <svg aria-hidden="true" viewBox="0 0 32 32"><circle cx="16" cy="10" r="5"/><path d="M7 25c0-4 3.6-6 9-6s9 2 9 6c0 2-2 3-4 3H11c-2 0-4-1-4-3Z"/></svg>
      </button>
    </aside>

    <div class="main-column">

    <main>
      <section id="empty-state" class="empty-state" aria-labelledby="welcome-title">
        <h1 id="welcome-title">How can I help you today?</h1>
      </section>

      <section id="conversation" class="conversation" hidden aria-live="polite">
        <div class="query-row"><div id="query-bubble" class="query-bubble"></div></div>
        <div id="answer" class="answer"></div>
        <section id="sources-section" hidden>
          <h2>Sources</h2>
          <div id="sources" class="sources"></div>
        </section>
      </section>

      <section id="loading" class="loading" hidden aria-live="polite">
        <span class="spinner" aria-hidden="true"></span><span>Searching the web and analyzing your image…</span>
      </section>
      <div id="error" class="error" role="alert" hidden></div>
    </main>

    <footer class="composer-area">
      <form id="search-form" class="composer">
        <div id="image-preview" class="image-preview" hidden>
          <img id="preview-image" alt="Selected image preview">
          <strong id="preview-name"></strong>
          <button id="remove-image" class="icon-button" type="button" aria-label="Remove image">×</button>
        </div>
        <label class="sr-only" for="prompt">Ask a question</label>
        <textarea id="prompt" name="prompt" rows="2" placeholder="Ask anything" required></textarea>
        <div class="composer-actions">
          <label class="image-picker" for="image-input" aria-label="Add image">
            <span class="plus" aria-hidden="true">+</span>
          </label>
          <input id="image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button id="submit-button" class="submit-button" type="submit" aria-label="Submit question" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 12 6-6 6 6m-6-6v13"/></svg></button>
        </div>
      </form>
    </footer>
    </div>
  </div>
  <script src="/assets/app.js" type="module"></script>
</body>
</html>
